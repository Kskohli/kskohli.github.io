# Casebook editor settings (Sveltia CMS).
# Sign in at https://thelabnuc.com/admin/ with a GitHub fine-grained token
# that has "Contents: Read and write" on this one repository.

backend:
  name: github
  repo: kskohli/kskohli.github.io   # <-- change this, for example karamkohli/thelabnuc.github.io
  branch: main

site_url: https://thelabnuc.com
display_url: https://thelabnuc.com/#casebook

# Pictures and screenshots you add to a write-up are stored here.
media_folder: casebook/images
public_folder: /casebook/images

collections:
  - name: casebook
    label: Casebook
    label_singular: Entry
    folder: casebook/posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{kind}}: {{title}}"
    sortable_fields: [date, title]
    fields:
      - label: Kind
        name: kind
        widget: select
        options:
          - { label: Customer case, value: customer }
          - { label: Lab work, value: lab }
        default: lab
      - { label: Title, name: title, widget: string }
      - label: Date
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: Problem (one short line)
        name: problem
        widget: string
        hint: What was going wrong? Shown on the card.
      - label: Solution (one short line)
        name: solution
        widget: string
        hint: How it was fixed. Shown on the card.
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        hint: Technologies involved, for example ESXi, Veeam, Kubernetes.
      - label: YouTube video ID
        name: video
        widget: string
        required: false
        pattern: ['^$|^[A-Za-z0-9_-]{6,20}$', 'Only the ID, which is the part after v= in the YouTube link']
        hint: For https://www.youtube.com/watch?v=AbC123xyz the ID is AbC123xyz
      - label: Draft
        name: draft
        widget: boolean
        default: true
        hint: Turn off to publish. Drafts are not put on the website.
      - label: Write-up
        name: body
        widget: markdown
        required: false
        hint: The full write-up. Use the image button, or paste or drag screenshots into the editor.
